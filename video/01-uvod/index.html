/* Boje landinga logomedo.com (src/components/Tema.astro, emails/) */
:root {
  --papir: #f6f3ee;
  --tinta: #1d1a14;
  --med: #d48a06;
  --med-tamni: #a86a00;
  --med-tekst: #b06c00;
  --siva: #6f665a;
  --crta: #eee5d8;
  --karta: #ffffff;
  --font-naslov: "Fraunces", Georgia, serif;
  --font-tekst: "Nunito", system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--papir); }
body { font-family: var(--font-tekst); color: var(--tinta); }
#root { position: relative; width: 100%; height: 100%; overflow: hidden;
  background: radial-gradient(1200px 700px at 78% 30%, #fbf2df 0%, rgba(251,242,223,0) 70%), var(--papir); }

/* Prozor preglednika sa snimkom aplikacije: 1100 × (36 + 687.5) */
.win { position: absolute; width: 1100px; border-radius: 18px; background: var(--karta); overflow: hidden;
  box-shadow: 0 2px 0 rgba(0,0,0,.03), 0 34px 80px rgba(80,52,8,.20), 0 0 0 1px rgba(60,40,10,.07); }
.win-bar { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #f1ece4; border-bottom: 1px solid var(--crta); }
.win-bar i { width: 11px; height: 11px; border-radius: 50%; background: #ddd3c4; display: block; }
.win-bar span { margin-left: 18px; font-size: 15px; font-weight: 700; color: var(--siva); background: #fff; border-radius: 8px; padding: 3px 14px; }
.win-view { position: relative; width: 1100px; height: 687.5px; overflow: hidden; }
.win-view img { position: absolute; left: 0; top: 0; width: 1100px; height: 687.5px; display: block; transform-origin: 0 0; }

/* Tekst uz sliku (lijevi stupac) */
.stupac { position: absolute; left: 120px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.oznaka { font-family: var(--font-tekst); font-weight: 900; font-size: 28px; letter-spacing: .14em; text-transform: uppercase; color: var(--med-tamni); }
.naslov { font-family: var(--font-naslov); font-weight: 600; font-size: 66px; line-height: 1.06; letter-spacing: -0.015em; color: var(--tinta); font-variation-settings: "SOFT" 100, "opsz" 144; }
.naslov em { font-style: normal; color: var(--med-tekst); }
.pod { font-size: 30px; line-height: 1.35; font-weight: 600; color: var(--siva); }

.cip { display: inline-flex; align-items: baseline; gap: 12px; background: var(--karta); border-radius: 16px; padding: 14px 22px;
  box-shadow: 0 10px 30px rgba(80,52,8,.14), 0 0 0 1px rgba(60,40,10,.06); font-weight: 800; font-size: 28px; color: var(--tinta); }
.cip b { font-family: var(--font-naslov); font-weight: 700; font-size: 44px; color: var(--med-tekst); line-height: 1; }

/* Okvir koji ističe dio snimke */
.isticanje { position: absolute; border: 5px solid var(--med); border-radius: 14px; box-shadow: 0 0 0 9999px rgba(29,26,20,.0); }

/* Ilustracija iz kataloga na kartici */
.ilu { position: absolute; width: 230px; height: 230px; border-radius: 28px; background: var(--karta); padding: 14px;
  box-shadow: 0 18px 44px rgba(80,52,8,.16), 0 0 0 1px rgba(60,40,10,.06); }
.ilu img { width: 100%; height: 100%; object-fit: contain; display: block; }

/* Znak LogoMeda (heksagon s L, iz public/favicon.svg) */
.znak { display: block; }
